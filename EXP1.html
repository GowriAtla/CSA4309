
<!DOCTYPE html>
<html>
<head>
    <title>Library Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Library Management System</h1>

<h2>Register Student</h2>
<input id="name" placeholder="Student Name">
<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<button onclick="register()">Register</button>

<h2>Login</h2>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<select id="role">
    <option value="student">Student</option>
    <option value="admin">Admin</option>
</select>
<button onclick="login()">Login</button>

<p id="message"></p>

<h2>Book Management</h2>
<input id="title" placeholder="Book Name">
<input id="author" placeholder="Author">
<button onclick="addBook()">Add Book</button>

<input id="search" placeholder="Search Book">
<button onclick="searchBook()">Search</button>

<ul id="books"></ul>

<h2>Issue / Return Book</h2>
<input id="issueName" placeholder="Student Username">
<input id="issueTitle" placeholder="Book Name">
<button onclick="issueBook()">Issue Book</button>
<button onclick="returnBook()">Return Book</button>

<h2>Borrow History and Fine</h2>
<button onclick="history()">View History</button>
<ul id="records"></ul>

<h2>Study Materials</h2>
<select id="year">
    <option value="1">1st Year</option>
    <option value="2">2nd Year</option>
    <option value="3">3rd Year</option>
    <option value="4">4th Year</option>
</select>
<select id="semester">
    <option value="1">Semester 1</option>
    <option value="2">Semester 2</option>
</select>
<input id="material" placeholder="Material Name">
<input id="link" placeholder="Material URL">
<button onclick="addMaterial()">Add Material</button>
<button onclick="viewMaterial()">View Materials</button>
<ul id="materials"></ul>

<script src="script.js"></script>
</body>
</html>
